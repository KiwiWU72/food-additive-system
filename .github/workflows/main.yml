name: Auto-Update Food Additives Database

# 設定觸發時間
on:
  schedule:
    # 這裡設定為每個月 1 號的凌晨 2:00 (UTC 時間)，約為台灣時間早上 10:00
    - cron: '0 2 1 * *'
  
  # 允許手動點擊按鈕執行
  workflow_dispatch: 

# 賦予寫入權限，讓機器人可以把更新後的法規存回 GitHub
permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載專案檔案
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝爬蟲需要的工具與瀏覽器 (Playwright)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      # 4. 讀取 FDA CSV 並初始化監控清單 (數據前處理層)
      # 【關鍵修復】: 使用 windows-1252 編碼來正確讀取 FDA 系統的特殊字元
      - name: Prepare Database from FDA CSV
        run: |
          python -c "
          import csv, json, os
          input_file = 'FoodSubstances.csv'
          output_file = 'db_compact.json'
          
          data = []
          if os.path.exists(input_file):
              with open(input_file, mode='r', encoding='windows-1252') as f:
                  # 跳過前 4 行無用的 FDA 宣告
                  for _ in range(4): next(f)
                  
                  reader = csv.DictReader(f)
                  for row in reader:
                      cas_no = row.get('CAS Reg No (or other ID)', '').strip()
                      name = row.get('Substance', '').strip()
                      effect = row.get('Used for (Technical Effect)', 'Additive').replace('<br />', '').strip()
                      
                      # 剝除 =T(\"...\") 雜訊字元
                      fema_no = row.get('FEMA No', '')
                      if fema_no.startswith('=T(\"'): fema_no = fema_no[4:-2]
                          
                      if name:
                          data.append({
                              'id': cas_no if cas_no else f'FDA-{name[:5]}',
                              'name': name,
                              'category': effect,
                              'source': 'US',
                              'status': 'active',
                              'metadata': { 'cas_no': cas_no, 'fema_no': fema_no }
                          })
              
              # 存回標準的 utf-8 格式 JSON
              with open(output_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              print(f'成功！已從 FDA CSV 萃取 {len(data)} 筆物質。')
          else:
              print('找不到 FoodSubstances.csv 檔案，跳過轉換。')
          "

      # 5. 執行總經理程式 (run_update.py)
      - name: Run Python Scraper
        run: python scrapers/run_update.py --scraper all

      # 6. 將變更存檔並推回 GitHub
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 確保包含剛轉換出來的 db_compact.json 以及爬蟲更新的檔案
          git add *.json
          
          # 檢查是否有法規更新，有的話才存檔
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Sync latest FDA/EFSA regulations"
          git push
