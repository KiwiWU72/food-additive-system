name: Auto-Update Food Additives Database

# 設定觸發時間
on:
  schedule:
    # 這裡設定為每個月 1 號的凌晨 2:00 (UTC 時間)，約為台灣時間早上 10:00
    - cron: '0 2 1 * *'
  
  # 允許手動點擊按鈕執行
  workflow_dispatch: 

# 賦予寫入權限，讓機器人可以把更新後的法規存回 GitHub
permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載專案檔案
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝爬蟲需要的工具與瀏覽器 (Playwright)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      # 4. 執行總經理程式 (run_update.py)
      # 它會去呼叫 scrapers 資料夾裡面的所有爬蟲
      - name: Run Python Scraper
        run: python scrapers/run_update.py --scraper all

      # 5. 將變更存檔並推回 GitHub
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 這裡假設你的資料庫名稱是 additives_db.json，請根據實際檔名修改
          git add *.json
          
          # 檢查是否有法規更新，有的話才存檔
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Sync latest FDA/EFSA regulations"
          git push
